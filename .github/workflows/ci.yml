# Actually run on GitHub Actions on 2026-09-21 -- see docs/BUILD_STATUS.md's
# V15 entry and docs/DECISIONS.md for what that first run found and fixed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input here -- package.json's own "packageManager"
      # field already pins pnpm@9.15.0, and pnpm/action-setup@v4 now
      # refuses to run if both specify a version (even the same one).
      # Found by actually running this workflow for the first time.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, lint, test every TypeScript package/app
        run: pnpm -r --filter='./packages/*' --filter='./apps/*' run build
      - run: pnpm -r --filter='./packages/*' --filter='./apps/*' run typecheck
      - run: pnpm -r --filter='./packages/*' --filter='./apps/*' run lint
      - run: pnpm -r --filter='./packages/*' --filter='./apps/*' run test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          pytest

      - name: Install Playwright browsers
        run: pnpm --filter @trustrail/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests (onboarding, first refund, denial, approval, receipt verification)
        run: pnpm test:e2e

  publish-images:
    # Only on a real push to main, never for PRs (an untrusted PR shouldn't
    # be able to publish an image under this repo's name), and only after
    # verify passes -- gives every deploy target (Railway, or anywhere
    # else) a tagged, provenanced image to pull instead of only ever
    # deploying straight from source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: merchant-sandbox
            dockerfile: apps/merchant-sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trustrail-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/trustrail-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
