[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrail"
version = "0.1.0"
description = "Python client for the TrustRail API: delegated, revocable agent authority with signed receipts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
    "httpx>=0.27,<1.0",
    "cryptography>=42,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["trustrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
